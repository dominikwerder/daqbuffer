[package]
name = "daqbuffer"
version = "0.5.5-aa.10"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2021"

[dependencies]
futures-util = "0.3.31"
bytes = "1.10.0"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_yaml = "0.9.34"
chrono = "0.4.39"
url = "2.5.4"
clap = { version = "4.5.28", features = ["derive", "cargo"] }
daqbuf-err = { path = "../../../daqbuf-err" }
taskrun = { path = "../taskrun" }
netpod = { path = "../../../daqbuf-netpod", package = "daqbuf-netpod" }
disk = { path = "../disk" }
httpclient = { path = "../httpclient" }
streams = { path = "../../../daqbuf-streams", package = "daqbuf-streams" }
daqbufp2 = { path = "../daqbufp2" }

[features]
DISABLED = []
